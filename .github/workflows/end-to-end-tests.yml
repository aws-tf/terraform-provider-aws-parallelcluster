# This workflow validates PRs and pushes with code checks, unit tests and end-to-end tests.
name: E2E Tests

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      ref:
        description: |
          ref: the branch, tag or SHA to checkout.
          If empty, the ref is inferred from the event that triggered the workflow.
        required: false
        default: ''
        type: string
      publish_metric:
        description: |
          publish_metric: if True, the outcome of the tests is published as an alarmed CloudWatch metric.
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  end-to-end-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_target: [test_end2end_cluster, test_end2end_image]
        # Must satisfy the `go` directive in go.mod.
        go: [1.27.4]
        terraform: [1.8.0]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Setup Terraform ${{ matrix.terraform }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ACTION_E2E_TESTS_ROLE }}
          role-session-name: GitHub_${{ github.event.repository.name }}_End2EndTests
      - name: Generate Test ID
        run: echo "TEST_ID=$(uuidgen)" >> $GITHUB_ENV
      - name: Execute Tests (${{ matrix.test_target }})
        env:
          TF_ACC: "1"
          TEST_REGION: "us-east-1"
          TEST_AVAILABILITY_ZONE: "us-east-1a"
          TEST_PCAPI_STACK_NAME: "ParallelClusterAPI"
          TEST_USE_USER_ROLE: "true"
          TEST_CLUSTER_NAME: "test-cluster-github-${{ env.TEST_ID }}"
          TEST_IMAGE_NAME: "test-image-github-${{ env.TEST_ID }}"
        run: make ${{ matrix.test_target }}
        timeout-minutes: 120

  # Publishes the outcome of the E2E tests as a CloudWatch metric, so that a
  # CloudWatch alarm can make failures visible.
  # Pushes to main always report; a manual run only does so on request.
  publish-metric:
    name: Publish E2E Outcome Metric
    needs: end-to-end-tests
    # A cancelled or skipped test run says nothing about the health of the branch: it must
    # publish no data point at all, so that the alarm keeps the state it already had.
    if: >-
      ${{ always()
      && (github.event_name == 'push' || inputs.publish_metric)
      && (needs.end-to-end-tests.result == 'success'
      || needs.end-to-end-tests.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ACTION_E2E_TESTS_ROLE }}
          role-session-name: GitHub_${{ github.event.repository.name }}_E2EMetrics
      - name: Publish E2E Outcome Metric
        env:
          METRIC_VALUE: ${{ needs.end-to-end-tests.result == 'failure' && 1 || 0 }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          aws cloudwatch put-metric-data \
            --region us-east-1 \
            --namespace ParallelCluster \
            --metric-name TerraformProviderE2ETestFailure \
            --unit Count \
            --value "${METRIC_VALUE}" \
            --dimensions "Organization=${GH_REPOSITORY_OWNER},Branch=${GH_REF_NAME}"
        timeout-minutes: 5
