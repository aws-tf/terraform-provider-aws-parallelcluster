# This workflow validates PRs and pushes with code checks, unit tests and end-to-end tests.
name: Continuous Integration

on:
  # Pushes to main publish the coverage baseline.
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      COVERAGE_PATH: cover.out
      PREV_COVERAGE_PATH: min_coverage/cover.out
      TF_EXAMPLES_PATH: examples
      # Hard floor. The bar never goes below this, whatever main reports.
      MIN_COVERAGE: "82.0"
      # `go tool cover` reports one decimal place.
      COVERAGE_TOLERANCE: "0.1"
      # This is not currently exposed.
      # See: https://github.com/orgs/community/discussions/10052
      # See: https://github.com/actions/runner/issues/853
      WORKFLOW_FILE_NAME: ci.yml
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - 1.8.0
    steps:
        # Setup
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

        # Tests
      - name: Check terraform examples for proper formatting
        run: terraform fmt -recursive -check ${TF_EXAMPLES_PATH}
      - run: go mod download
      - name: Run Unit Tests
        run: go test ./... -v -run="^TestUnit" -cover -coverprofile=${COVERAGE_PATH}
        timeout-minutes: 10

        # Find and Pull the archived cover report of the last run.
        # Only pushes to main publish a baseline, so only merged code sets it.
      - name: Retrieve Previous Successful Run ID
        id: prev-run-id
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: process.env.WORKFLOW_FILE_NAME,
              branch: "main",
              event: "push",
              status: "success",
              per_page: 1
            })
            if (runs.data.total_count === 0) {
              core.warning(`No successful push run found on main to extract the coverage from.`);
              return;
            }
            return runs.data.workflow_runs[0].id;
          result-encoding: string
      - name: Download Coverage
        id: download-coverage
        if: steps.prev-run-id.outputs.result != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: min_coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev-run-id.outputs.result }}

        # Require the higher of MIN_COVERAGE and the last push to main, so a
        # force-merged drop cannot lower the bar below MIN_COVERAGE.
        # Pull requests only, so a push can still record an accepted drop.
      - name: Check for minimum coverage
        if: github.event_name == 'pull_request'
        run: |
          COVERAGE=$(go tool cover -func=${COVERAGE_PATH} | awk '/^total:/{print $3}')
          MIN=${MIN_COVERAGE}

          if [ -e ${PREV_COVERAGE_PATH} ] ; then
            PREV_COVERAGE=$(go tool cover -func=${PREV_COVERAGE_PATH} | awk '/^total:/{print $3}')
            BASELINE=$(echo "${PREV_COVERAGE%\%} - ${COVERAGE_TOLERANCE}" | bc)
            echo "Baseline from the last push to main: ${PREV_COVERAGE}"
            if [ $(echo "${BASELINE} > ${MIN}" | bc) -gt 0 ]; then
              MIN=${BASELINE}
            fi
          else
            echo "No baseline available; using MIN_COVERAGE=${MIN_COVERAGE}."
          fi

          printf '%s\n' "Required: ${MIN}%" "Current coverage: ${COVERAGE}"
          if [ $(echo "${COVERAGE%\%} < ${MIN}" | bc) -gt 0 ]; then
            echo "ERROR: Coverage ${COVERAGE} is below ${MIN}%."
            exit 1
          fi

        # Archive the cover report as the new baseline, on merges to main only.
      - name: Archive coverage results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{env.COVERAGE_PATH}}

  # `terraform fmt -recursive` covers the whole repository in one pass.
  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest version HashiCorp still supports, and the newest one. HashiCorp
        # supports the current minor and the one before it, so 1.16 goes end of life when
        # 1.18 is released: bump both entries then, here and in Terraform Validate below.
        # See: https://endoflife.date/terraform
        terraform:
          - 1.16.7
          - 1.17.2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Terraform ${{ matrix.terraform }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Terraform Format
        run: terraform fmt -recursive -check -diff ./

  # 'terraform validate' reads the provider schemas, so unlike 'fmt' it catches a
  # provider change that breaks these configurations. It looks at one working
  # directory at a time, hence the loop.
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with Terraform Format above.
        terraform:
          - 1.16.7
          - 1.17.2
    env:
      # One provider download shared by every `init` below, rather than one each.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Terraform ${{ matrix.terraform }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

        # -backend=false: the examples declare no backend and validation needs no
        # state. -input=false: a missing value must fail, not hang. -upgrade: lock
        # files are Git-ignored, so resolve what the constraints allow.
      - name: Validate every root configuration
        run: |
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"

          # The examples declaring the provider they need. Keep in step with the
          # repository. The snippets under examples/data-sources are absent:
          # tfplugindocs embeds those in the documentation, and they declare
          # neither a provider nor the variables they read, so `init` fails.
          configurations=(
            ./examples/provider
            ./examples/resources/aws-parallelcluster_cluster
            ./examples/resources/aws-parallelcluster_compute_fleet_status
            ./examples/resources/aws-parallelcluster_image
            ./examples/full/resources/aws-parallelcluster_cluster
            ./examples/full/resources/aws-parallelcluster_image
            ./examples/full/data-sources/aws-parallelcluster_cluster
            ./examples/full/data-sources/aws-parallelcluster_image
          )

          # Every configuration is validated even once one has failed, so that a
          # run reports all of the broken ones.
          invalid=()
          for configuration in "${configurations[@]}"; do
            echo "::group::${configuration}"
            if terraform -chdir="${configuration}" init -backend=false -input=false -upgrade -no-color \
              && terraform -chdir="${configuration}" validate -no-color; then
              echo "${configuration}: valid"
            else
              invalid+=("${configuration}")
            fi
            echo "::endgroup::"
          done
          if [ ${#invalid[@]} -gt 0 ]; then
            printf 'Invalid: %s\n' "${invalid[@]}" >&2
            exit 1
          fi
          echo "All root configurations are valid."
        timeout-minutes: 30

