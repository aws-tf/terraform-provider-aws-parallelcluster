# This workflow validates PRs and pushes with code checks, unit tests and end-to-end tests.
name: Continuous Integration

on:
  # Pushes to main publish the coverage baseline.
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      COVERAGE_PATH: cover.out
      PREV_COVERAGE_PATH: min_coverage/cover.out
      TF_EXAMPLES_PATH: examples
      # Hard floor. The bar never goes below this, whatever main reports.
      MIN_COVERAGE: "82.0"
      # `go tool cover` reports one decimal place.
      COVERAGE_TOLERANCE: "0.1"
      # This is not currently exposed.
      # See: https://github.com/orgs/community/discussions/10052
      # See: https://github.com/actions/runner/issues/853
      WORKFLOW_FILE_NAME: ci.yml
    strategy:
      fail-fast: false
      matrix:
        # Must satisfy the `go` directive in go.mod.
        go:
          - 1.27.4
        terraform:
          - 1.8.0
    steps:
        # Setup
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

        # Tests
      - name: Check terraform examples for proper formatting
        run: terraform fmt -recursive -check ${TF_EXAMPLES_PATH}
      - run: go mod download
      - name: Run Unit Tests
        run: go test ./... -v -run="^TestUnit" -cover -coverprofile=${COVERAGE_PATH}
        timeout-minutes: 10

        # Find and Pull the archived cover report of the last run.
        # Only pushes to main publish a baseline, so only merged code sets it.
      - name: Retrieve Previous Successful Run ID
        id: prev-run-id
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: process.env.WORKFLOW_FILE_NAME,
              branch: "main",
              event: "push",
              status: "success",
              per_page: 1
            })
            if (runs.data.total_count === 0) {
              core.warning(`No successful push run found on main to extract the coverage from.`);
              return;
            }
            return runs.data.workflow_runs[0].id;
          result-encoding: string
      - name: Download Coverage
        id: download-coverage
        if: steps.prev-run-id.outputs.result != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-${{ matrix.go }}
          path: min_coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev-run-id.outputs.result }}

        # Require the higher of MIN_COVERAGE and the last push to main, so a
        # force-merged drop cannot lower the bar below MIN_COVERAGE.
        # Pull requests only, so a push can still record an accepted drop.
      - name: Check for minimum coverage
        if: github.event_name == 'pull_request'
        run: |
          COVERAGE=$(go tool cover -func=${COVERAGE_PATH} | awk '/^total:/{print $3}')
          MIN=${MIN_COVERAGE}

          if [ -e ${PREV_COVERAGE_PATH} ] ; then
            PREV_COVERAGE=$(go tool cover -func=${PREV_COVERAGE_PATH} | awk '/^total:/{print $3}')
            BASELINE=$(echo "${PREV_COVERAGE%\%} - ${COVERAGE_TOLERANCE}" | bc)
            echo "Baseline from the last push to main: ${PREV_COVERAGE}"
            if [ $(echo "${BASELINE} > ${MIN}" | bc) -gt 0 ]; then
              MIN=${BASELINE}
            fi
          else
            echo "No baseline available; using MIN_COVERAGE=${MIN_COVERAGE}."
          fi

          printf '%s\n' "Required: ${MIN}%" "Current coverage: ${COVERAGE}"
          if [ $(echo "${COVERAGE%\%} < ${MIN}" | bc) -gt 0 ]; then
            echo "ERROR: Coverage ${COVERAGE} is below ${MIN}%."
            exit 1
          fi

        # Archive the cover report as the new baseline, on merges to main only.
      - name: Archive coverage results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.go }}
          path: ${{env.COVERAGE_PATH}}

  check-terraform:
    name: Check Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        path:
          - ./examples/provider
          - ./examples/resources/aws-parallelcluster_cluster
          - ./examples/resources/aws-parallelcluster_compute_fleet_status
          - ./examples/resources/aws-parallelcluster_image
          - ./examples/full/resources/aws-parallelcluster_cluster
          - ./examples/full/resources/aws-parallelcluster_image
          - ./examples/full/data-sources/aws-parallelcluster_cluster
          - ./examples/full/data-sources/aws-parallelcluster_image
        # The oldest version HashiCorp still supports, and the newest one. HashiCorp
        # supports the current minor and the one before it, so 1.16 goes end of life when
        # 1.18 is released: bump both entries then.
        # See: https://endoflife.date/terraform
        terraform:
          - 1.16.7
          - 1.17.2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Terraform ${{ matrix.terraform }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

        # Covers the whole repository, the acceptance-test fixtures included, so it
        # runs once per Terraform version.
      - name: Terraform Format
        if: matrix.path == './examples/provider'
        run: terraform fmt -recursive -check -diff ./

        # -backend=false: the examples declare no backend and validation needs no
        # state. -input=false: a missing value must fail, not hang. -upgrade: lock
        # files are Git-ignored, so resolve what each example pins.
      - name: Terraform Init
        run: terraform -chdir=${{ matrix.path }} init -backend=false -input=false -upgrade -no-color
        timeout-minutes: 10
      - name: Terraform Validate
        run: terraform -chdir=${{ matrix.path }} validate -no-color
        timeout-minutes: 5

